<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>
</head>
<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://www.banpresto.es/wp-content/uploads/2026/07/logo_84312.jpg" alt="figura banpresto de tony tony chopper">
    </section>
    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name">Nombre en la Tarjeta<span aria-hidden="true">*</span></label>
            <input id="card-name" name="card-name" type="text" required><br>

            <label for="card-number">Número de la Tarjeta<span aria-hidden="true">*</span></label>
            <input id="card-number" name="card-number" type="text" aria-describedby="card-number-help" required>
            <p id="card-number-help">Ingrese los 16 números de su tarjeta</p>

            <label for="expiry-date">Fecha de Vencimiento<span aria-hidden="true">*</span></label>
            <input id="expiry-date" name="expiry-date" type="text" placeholder="MM/AA" required><br>

            <label for="cvv">CVV<span aria-hidden="true">*</span></label>
            <input id="cvv" name="cvv" type="text" maxlength="3" placeholder="123" required><br>

            <button type="submit">Pagar</button>
        </form>
    </section>
    <a href="../index.html"> Volver a Mis Proyectos de HTML</a>
    <br>
    <a href="../../index.html">Volver al portfolio</a>
</body>
</html>
