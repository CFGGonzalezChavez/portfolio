<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlador de Audio Accesible</title>
</head>
<body>
    <h1>Audio Controls</h1>

    <button type="button">Play</button>

    <div>
      <span id="volume-label">Volume</span>
      <span id="volume-description">Adjust the sound level</span>
      <input type="range" min="0" max="100" value="50"
        aria-labelledby="volume-label volume-description">
    </div>

    <button type="button">Mute</button>
    <a href="../index.html"> Volver a Mis Proyectos de HTML</a>
    <br>
    <a href="../../index.html">Volver al portfolio</a>
</body>
</html>
